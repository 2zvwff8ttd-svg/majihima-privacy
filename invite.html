<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マジ暇で友達になろう</title>
<meta name="description" content="タップするとマジ暇が開いて、そのまま友達になれます。">
<meta property="og:title" content="マジ暇で友達になろう">
<meta property="og:description" content="タップするとマジ暇が開いて、そのまま友達になれます。">
<meta property="og:image" content="https://2zvwff8ttd-svg.github.io/majihima-privacy/icon.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-itunes-app" content="app-id=6819988938">
<style>
  :root { --text: #1C1B22; --sub: #6B6A75; --primary: #6C4CF5; --bg: #FAFAFC; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(108,76,245,.25); }
  h1 { font-size: 1.35rem; margin: 20px 0 8px; }
  p { color: var(--sub); line-height: 1.7; margin: 0 0 24px; font-size: .95rem; }
  a.button { display: block; padding: 15px; border-radius: 14px; font-weight: 700; text-decoration: none; margin-top: 12px; }
  a.primary { background: var(--primary); color: #fff; }
  a.secondary { background: #EFE9FF; color: var(--primary); }
  .note { font-size: .8rem; margin-top: 20px; }
  .error { color: #C2410C; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="マジ暇">
  <h1 id="title">マジ暇で友達になろう</h1>
  <p id="lead">「マジ暇で開く」をタップすると、アプリが開いて<br>そのまま友達になれます。</p>
  <a id="open" class="button primary" href="#">マジ暇で開く</a>
  <a class="button secondary" href="https://apps.apple.com/app/id6819988938">App Storeでダウンロード</a>
  <p class="note">まだアプリを入れていない人は、ダウンロードして登録したあと、<br>もう一度このリンクをタップしてください。</p>
</main>
<script>
  (function () {
    var token = new URLSearchParams(location.search).get('t') || '';
    var open = document.getElementById('open');
    if (!/^[0-9a-f]{32}$/.test(token)) {
      document.getElementById('title').textContent = 'このリンクは使えません';
      document.getElementById('lead').innerHTML = '<span class="error">招待した人に、もう一度リンクを送ってもらってください。</span>';
      open.style.display = 'none';
      return;
    }
    var appUrl = 'majihima://invite/' + token;
    open.href = appUrl;
    // 開いた瞬間に一度だけアプリを開こうとする（入っていなければ何も起きず、このページが残る）
    setTimeout(function () { location.href = appUrl; }, 300);
  })();
</script>
</body>
</html>
